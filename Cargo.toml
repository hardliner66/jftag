[package]
name = "jftag"
version = "1.0.0"
edition = "2024"
description = "CLI and library to encode JSON into a short, URL-safe text string and decode it back"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/hardliner66/jftag"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
serde_json = "1"
